{% extends "base.html" %}
{% block title %}{{ 'Edit' if doc else 'New' }} Document – DocuFlow{% endblock %}

{% block extra_head %}
<style>
    body {
        background: linear-gradient(160deg, #050714 10%, #0a0f2a 90%);
    }

    .glass-container {
        background: linear-gradient(180deg, rgba(20, 28, 58, 0.7), rgba(14, 18, 42, 0.7));
        border: 1px solid rgba(150, 163, 255, 0.15);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(14px);
        padding: 2rem;
        border-radius: 1rem;
    }

    .ql-container {
        min-height: 300px;
        border-radius: 0 0 0.375rem 0.375rem;
        background-color: white;
    }

    .glass-button {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(150, 163, 255, 0.15);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(12px);
        transition: background 0.3s ease;
    }

    .glass-button:hover {
        background: rgba(51, 65, 85, 0.7);
    }

    .ql-toolbar.ql-snow {
        background-color: white;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-family: 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
        padding: 8px;
    }

    @media (max-width: 768px) {
        .glass-container {
            padding: 1.2rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto mt-10 mb-16 glass-container text-slate-100">

    <h2 class="text-2xl font-bold mb-6 text-white">{{ 'Edit Document' if doc else 'Create New Document' }}</h2>

    <!-- Document Form -->
    <form method="POST">
        <div class="mb-6">
            <label for="title" class="block text-sm font-medium text-slate-300 mb-2">Title</label>
            <input type="text" id="title" name="title" required
                   value="{{ doc['title'] if doc else '' }}"
                   class="w-full px-4 py-2 rounded-lg border border-slate-600 text-black placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                   placeholder="Enter a document title">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-300 mb-2">Content</label>
            <div id="quill-editor" class="bg-white rounded border text-black "></div>
            <textarea name="content" id="content" hidden></textarea>
        </div>

        <div class="flex flex-wrap justify-between items-center gap-4 mt-8">
            <a href="{{ url_for('creator_dashboard') }}"
               class="inline-flex items-center px-4 py-2 rounded-lg glass-button text-sm text-white">
                ← Back to Dashboard
            </a>

            <div class="flex flex-wrap gap-3">
                <button type="submit" name="action" value="save"
                        class="px-4 py-2 rounded-lg bg-slate-600 text-white hover:bg-slate-700">
                    Save Draft
                </button>
                <button type="submit" name="action" value="submit"
                        class="px-4 py-2 rounded-lg bg-cyan-600 text-white hover:bg-cyan-700">
                    Submit for Review
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const quill = new Quill('#quill-editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                [{ header: [1, 2, 3, false] }],
                ['bold', 'italic', 'underline'],
                ['blockquote', 'code-block'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                ['clean']
            ]
        }
    });

    const content = `{{ doc['content'] | safe if doc else '' }}`;
    quill.root.innerHTML = content;

    document.querySelector('form').onsubmit = function () {
        document.getElementById('content').value = quill.root.innerHTML;
    };
</script>
{% endblock %}
